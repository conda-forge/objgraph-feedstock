schema_version: 1

context:
  version: "3.7.0"
  build_number: 0

package:
  name: objgraph
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/o/objgraph/objgraph-${{ version }}.tar.gz
    sha256: b6ef4b244217410509b257970413b01a979d54df48d2d4055b6941e8679ddbbb

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python-graphviz
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - objgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Draws Python object reference graphs with graphviz
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/objgraph
  repository: https://github.com/mgedmin/objgraph
  documentation: https://mg.pov.lt/objgraph

extra:
  recipe-maintainers:
    - marcelotrevisani
    - jsmolic
